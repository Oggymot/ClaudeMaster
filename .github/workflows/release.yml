name: Release
# Novy tag vX.Y.Z -> zip ClaudeMaster/ jako GitHub Release (WowUp ho stahne)
# Nebo rucne (Actions -> Release -> Run workflow, verze napr. 1.1.25): tag vytvori release sam.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze bez v (napr. 1.1.25)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/ClaudeMaster
          cp *.toc *.lua dist/ClaudeMaster/
          cp -r Textures dist/ClaudeMaster/
          sed -i "s/^## Version:.*/## Version: ${VER}/" dist/ClaudeMaster/ClaudeMaster.toc
          cd dist && zip -r "ClaudeMaster-${VER}.zip" ClaudeMaster
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/ClaudeMaster-*.zip
          generate_release_notes: true
