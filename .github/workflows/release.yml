name: Release
# Novy tag vX.Y.Z -> zip ClaudeMaster/ jako GitHub Release (WowUp ho stahne)
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist/ClaudeMaster
          cp *.toc *.lua dist/ClaudeMaster/
          sed -i "s/^## Version:.*/## Version: ${VER}/" dist/ClaudeMaster/ClaudeMaster.toc
          cd dist && zip -r "ClaudeMaster-${VER}.zip" ClaudeMaster
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeMaster-*.zip
          generate_release_notes: true
